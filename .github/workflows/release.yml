name: Publish package

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Package index (select a version tag as the workflow ref)
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  selected-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Require a release tag on the intended repository
        env:
          SELECTED_INDEX: ${{ inputs.repository }}
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = 'nothans/ex-regex'
          test "$GITHUB_REF_TYPE" = 'tag'
          test "$SELECTED_INDEX" = 'testpypi' || test "$SELECTED_INDEX" = 'pypi'

  checks:
    needs: selected-tag
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.ref_name }}

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.repository }}
      url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/p/ex-regex' || 'https://pypi.org/p/ex-regex' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - name: Publish the tested artifacts using OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          repository-url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          attestations: true
